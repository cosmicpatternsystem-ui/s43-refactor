name: Artifact Retention Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  artifact-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run artifact retention gate
        run: |
          python -m pytest tests/test_evidence_record_schema.py -q
