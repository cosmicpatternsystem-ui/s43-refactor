name: Artifact Retention Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  artifact-retention-gate:
    name: Assert artifact retention evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile artifact retention validator and tests
        run: |
          python -m py_compile \
            tools/artifact_retention_check.py \
            tests/test_artifact_retention.py \
            tests/test_artifact_retention_negative.py

      - name: Run artifact retention tests
        run: |
          python -m pytest \
            tests/test_artifact_retention.py \
            tests/test_artifact_retention_negative.py \
            -q

      - name: Validate artifact retention audit evidence
        run: |
          python tools/artifact_retention_check.py