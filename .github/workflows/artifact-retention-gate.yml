name: Artifact Retention Gate

on:
  pull_request:
    paths:
      - 'docs/security/audit/sample-artifact-retention.json'
      - 'tools/artifact_retention_check.py'
      - 'tests/test_artifact_retention.py'
      - 'tests/test_artifact_retention_negative.py'
      - '.github/workflows/artifact-retention-gate.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  artifact-retention:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify artifact retention evidence exists
        run: |
          test -f docs/security/audit/sample-artifact-retention.json

      - name: Compile artifact retention tooling and tests
        run: |
          python -m py_compile \
            tools/artifact_retention_check.py \
            tools/artifact_evidence_ledger_check.py \
            tests/test_artifact_retention.py \
            tests/test_artifact_retention_negative.py \
            tests/test_artifact_evidence_ledger.py

      - name: Run artifact retention tests
        run: |
          python -m pytest \
            tests/test_artifact_retention.py \
            tests/test_artifact_retention_negative.py \
            tests/test_artifact_evidence_ledger.py \
            -q

      - name: Validate artifact retention audit evidence
        run: |
          python tools/artifact_retention_check.py

      - name: Validate artifact evidence ledger
        run: |
          python tools/artifact_evidence_ledger_check.py
