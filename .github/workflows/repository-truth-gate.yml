name: repository-truth-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  repository-truth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: repository truth gate
        run: python tools/governance/roadmap_truth_check.py