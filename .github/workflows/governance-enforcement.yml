name: governance-enforcement

on:
  push:
    branches:
      - main
      - master
      - develop
      - '**'
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PROJECT_STATE.md
          test -f docs/ROADMAP.md
          test -f docs/NEXT_ACTIONS.md
          test -f docs/governance/GOVERNANCE_BASELINE.md
          test -f docs/governance/LOCK_REGISTRY.json
          test -f docs/governance/LOCK_SCHEMA.json
          test -f tools/project_status.py
          test -f tests/test_governance_bootstrap.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: Validate governance registry against schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import validate
          root = Path('.')
          schema = json.loads((root / 'docs/governance/LOCK_SCHEMA.json').read_text(encoding='utf-8'))
          registry = json.loads((root / 'docs/governance/LOCK_REGISTRY.json').read_text(encoding='utf-8'))
          validate(instance=registry, schema=schema)
          print('registry schema validation passed')
          PY

      - name: Run bootstrap status
        run: |
          python tools/project_status.py

      - name: Run tests
        run: |
          pytest -q tests/test_governance_bootstrap.py