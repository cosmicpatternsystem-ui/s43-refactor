name: Project constitution validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  project-constitution-validation:
    name: Project constitution validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run project constitution check
        run: python tools/project_constitution_check.py

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run project constitution tests
        run: python -m pytest tests/test_project_constitution_pack.py -q
