name: Global Governance Locks Gate

on:
  pull_request:
    paths:
      - "docs/governance/**"
      - "docs/roadmap/**"
      - "tests/test_global_governance_locks.py"
      - ".github/workflows/global-governance-locks-gate.yml"
  push:
    branches:
      - main
    paths:
      - "docs/governance/**"
      - "docs/roadmap/**"
      - "tests/test_global_governance_locks.py"
      - ".github/workflows/global-governance-locks-gate.yml"

permissions:
  contents: read

jobs:
  global-governance-locks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run global governance lock tests
        run: python -m pytest tests/test_global_governance_locks.py

      - name: Run roadmap governance tests when present
        shell: bash
        run: |
          if [ -f tests/test_roadmap_governance.py ]; then
            python -m pytest tests/test_roadmap_governance.py
          fi
