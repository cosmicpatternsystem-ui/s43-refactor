name: Evidence Validation Gate

on:
  pull_request:
    paths:
      - "asoctl.py"
      - "repo/tools/validate_evidence_record.py"
      - "repo/schemas/evidence_record.schema.json"
      - "artifacts/examples/evidence_record.example.json"
      - "tests/test_evidence_record_schema.py"
      - "tests/test_asoctl_evidence_validate.py"
      - ".github/workflows/evidence-validation-gate.yml"
  push:
    branches:
      - main
    paths:
      - "asoctl.py"
      - "repo/tools/validate_evidence_record.py"
      - "repo/schemas/evidence_record.schema.json"
      - "artifacts/examples/evidence_record.example.json"
      - "tests/test_evidence_record_schema.py"
      - "tests/test_asoctl_evidence_validate.py"
      - ".github/workflows/evidence-validation-gate.yml"

jobs:
  evidence-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify required files exist
        run: |
          test -f asoctl.py
          test -f repo/tools/validate_evidence_record.py
          test -f repo/schemas/evidence_record.schema.json
          test -f artifacts/examples/evidence_record.example.json
          test -f tests/test_evidence_record_schema.py
          test -f tests/test_asoctl_evidence_validate.py

      - name: Compile validation tooling
        run: |
          python -m py_compile asoctl.py repo/tools/validate_evidence_record.py

      - name: Run focused tests
        run: |
          python -m pytest tests/test_evidence_record_schema.py tests/test_asoctl_evidence_validate.py

      - name: Run final evidence validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-validation-artifacts
          python asoctl.py evidence validate | tee evidence-validation-artifacts/evidence-validation-result.txt
          cat > evidence-validation-artifacts/evidence-validation-metadata.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "job": "${GITHUB_JOB}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "actor": "${GITHUB_ACTOR}",
            "event_name": "${GITHUB_EVENT_NAME}"
          }
          EOF

      - name: Upload evidence validation artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-validation-artifacts/
          if-no-files-found: error
          retention-days: 90