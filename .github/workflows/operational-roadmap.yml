name: Operational Roadmap Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  assert-operational-roadmap-contract:
    name: Assert operational roadmap contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate canonical roadmap authority exists
        shell: bash
        run: |
          test -f docs/governance/ROADMAP_CURRENT.json
          test -f docs/governance/ROADMAP_CANONICAL.md

      - name: Validate canonical roadmap authority
        shell: pwsh
        run: ./scripts/validate-roadmap-authority.ps1

      - name: Validate canonical roadmap schema
        shell: pwsh
        run: ./scripts/validate-roadmap.ps1

      - name: Validate canonical roadmap truth
        shell: bash
        run: python tools/governance/roadmap_truth_check.py