name: Operational Roadmap

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  roadmap:
    name: Canonical roadmap validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell
        shell: bash
        run: pwsh -v

      - name: Validate canonical roadmap authority
        shell: pwsh
        run: ./scripts/validate-roadmap-authority.ps1

      - name: Validate canonical roadmap schema
        shell: pwsh
        run: ./scripts/validate-roadmap.ps1

      - name: Validate canonical roadmap truth
        shell: bash
        run: python tools/governance/roadmap_truth_check.py
