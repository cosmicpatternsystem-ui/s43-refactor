name: Operational Roadmap
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/governance/ROADMAP_CURRENT.json'
      - 'docs/governance/ROADMAP_CANONICAL.md'
  pull_request:
    branches: [ main ]

jobs:
  validate-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Roadmap Truth Check
        run: python tools/governance/roadmap_truth_check.py
      - name: Run Roadmap Guard
        run: python scripts/roadmap_guard.py