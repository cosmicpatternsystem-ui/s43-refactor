name: Assert operational roadmap contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  assert-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Canonical Roadmap Files Existence
        run: |
          test -f docs/governance/ROADMAP_CURRENT.json
          test -f docs/governance/ROADMAP_CANONICAL.md

      - name: Run Roadmap Governance Checkers
        shell: pwsh
        run: |
          ./scripts/validate-roadmap-authority.ps1
          ./scripts/validate-roadmap.ps1
          python tools/governance/roadmap_truth_check.py
          ./scripts/reject-roadmap-shadow-authorities.ps1