name: Release Governance Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  roadmap-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          python -m pip install pytest jsonschema

      - name: Run release governance enforcement
        shell: bash
        run: |
          python tools/release_governance_check.py
          python -m pytest tests/test_release_governance_enforcement.py -q

- name: Run roadmap governance tests
        shell: bash
        run: |
          python -m pytest tests/test_roadmap_governance.py -q
