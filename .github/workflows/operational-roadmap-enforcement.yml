name: enforce-roadmap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Roadmap Guard
        run: python scripts/roadmap_guard.py

      - name: Verify Roadmap Freshness
        run: |
          git diff --exit-code -- docs/governance/ROADMAP_CURRENT.json || {
            echo "::error::docs/governance/ROADMAP_CURRENT.json is stale. Run ./scripts/update-roadmap.ps1 and commit the result."
            exit 1
          }

      - name: Display Roadmap State
        run: |
          git diff -- docs/governance/ROADMAP_CURRENT.json || true
          sed -n '1,60p' docs/governance/ROADMAP_CURRENT.json || true