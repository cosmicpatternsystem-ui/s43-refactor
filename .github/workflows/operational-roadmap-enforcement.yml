name: Operational Roadmap Enforcement
on:
  pull_request:
    paths:
      - 'docs/governance/ROADMAP_CURRENT.json'

jobs:
  enforce-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enforce Governance Authority
        run: python scripts/roadmap_guard.py